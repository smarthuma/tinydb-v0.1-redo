[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinydb"
version = "0.1.0"
description = "用于学习数据库内部原理的嵌入式关系型 Python 数据库（从零重置版）"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tinydb contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
tinydb = "tinydb.cli:main"

[tool.setuptools.packages.find]
include = ["tinydb*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not bench'"
markers = ["bench: 非阻塞性能基准测试"]

[tool.coverage.run]
source = ["tinydb"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
omit = ["tinydb/cli.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
